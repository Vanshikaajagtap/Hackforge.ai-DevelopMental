# Lint config: correctness rules (pyflakes, syntax/runtime errors, bugbear). Run: ruff check app scripts tests
line-length = 140
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "B904",   # `raise ... from` inside except: our ParseError paths already chain where it matters
  "B905",   # zip() without strict=: lengths are equal by construction
]

[lint.per-file-ignores]
"tests/*" = ["E731", "B011"]
